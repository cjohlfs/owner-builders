    <!-- STRUCTURED DATA (SEO GOLD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Koi Build",
      "alternateName": "Koi Build Consulting",
      "url": "https://www.koi.build",

      "priceRange": "$$",

        "addressRegion": "Nationwide"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Construction Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Owner Builder Consulting" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Flat-Fee General Contracting" } }
        ]
      }
